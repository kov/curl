[package]
name = "curl-tool"
description = "The curl command-line tool, on curl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "curl"
path = "src/main.rs"

[features]
# The debug test build: track allocations as the C tool's debug build does.
debug-hooks = ["curl-alloc/debug-hooks", "curl-core/debug-hooks"]

[[test]]
name = "memdebug"
required-features = ["debug-hooks"]

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }

[lints]
workspace = true
