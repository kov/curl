[package]
name = "curl-ldap"
description = "LDAP and LDAPS for the curl rewrite, from OpenLDAP's libldap or WinLDAP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "ldap"

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }

# WinLDAP, its certificates and SSPI's identities; whether the build is
# Windows' Unicode one, which calls WinLDAP's wide functions.
[target.'cfg(windows)'.dependencies]
curl-os = { path = "../curl-os" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Networking_Ldap",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
# The fake servers' accept, bounded in time.
curl-core = { path = "../curl-core", features = ["test-util"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[build-dependencies]
curl-build = { path = "../curl-build" }
cc = "1.10.0"

[lints]
workspace = true
