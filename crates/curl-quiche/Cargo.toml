[package]
name = "curl-quiche"
description = "HTTP/3 over QUIC for the curl rewrite, from quiche over the OpenSSL backend's BoringSSL"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The debug build's allocation tracker, which leaves quiche's own alone.
debug-hooks = ["curl-alloc/debug-hooks"]

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }
curl-os = { path = "../curl-os" }
libc = "0.2"
# quiche itself, without its `boring` crate: its TLS is the BoringSSL the
# OpenSSL backend links (`OPENSSL_DIR`), the one copy in the program.
# `ffi` for the one call that hands quiche an SSL made elsewhere,
# `quiche_conn_new_with_tls`, which its Rust API lacks; `qlog` for the
# qlog a connection writes, as C's libquiche is built with it.
quiche = { version = "=0.30.0", default-features = false, features = ["ffi", "qlog"] }
# The library found, which says whether it is BoringSSL
# (`DEP_OPENSSL_BORINGSSL`), as quiche needs; and linked, as
# `curl-openssl` links it.
openssl-sys = "0.9.118"

[dev-dependencies]
curl-core = { path = "../curl-core", features = ["test-util"] }
# The TLS session a connection is handed, over the same BoringSSL.
curl-openssl = { path = "../curl-openssl" }
# The certificates the server the tests start shows.
openssl = "0.10.82"

[lints]
workspace = true
