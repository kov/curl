[package]
name = "curl-sys-abi"
description = "libcurl's C ABI, translated onto curl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "curl"
crate-type = ["cdylib"]

[features]
# Answers names by c-ares (C's `--enable-ares`), unless the threaded resolver
# is chosen; one or the other is needed.
default = ["c-ares", "libssh", "openssl"]
# One TLS library, chosen as the library is built: OpenSSL, with HTTP/3
# over ngtcp2 and Ed25519 for message signatures; GnuTLS, with Ed25519
# from its nettle and no HTTP/3 (ngtcp2's GnuTLS crypto is not bound); or
# Schannel (Windows), with neither, as C's builds with them.
openssl = ["dep:curl-openssl", "dep:curl-ngtcp2", "dep:openssl-sys", "curl-core/quic", "curl-core/httpsig"]
gnutls = ["dep:curl-gnutls", "curl-core/httpsig"]
schannel = ["dep:curl-schannel"]
c-ares = ["dep:curl-ares"]
# One SSH library for SCP and SFTP, chosen as the library is built: libssh
# (C's `CURL_USE_LIBSSH`), as distributions build it, or libssh2 (C's
# `CURL_USE_LIBSSH2`), as the reference build has it.
libssh = ["dep:curl-libssh"]
libssh2 = ["dep:curl-libssh2"]
# The hooks of a C debug build: the curl_dbg_* exports, memory tracking
# and the libcurl-d.so.4 soname.
debug-hooks = ["curl-alloc/debug-hooks", "curl-ares?/debug-hooks", "curl-core/debug-hooks", "curl-gssapi/debug-hooks"]
# Read `long double` printf arguments in Rust (aarch64 only), with nightly's
# `f128`; without it a C helper reads them.
nightly = []
# The threaded resolver as the system's (C's `--enable-threaded-resolver`).
threaded-resolver = ["curl-core/threaded-resolver"]
# Host names converted by Apple's ICU in place of libidn2 (C's
# `USE_APPLE_IDN`).
apple-idn = ["curl-idn2/apple-idn"]
# Host names converted by Windows' IdnToAscii and IdnToUnicode in place
# of libidn2 (C's `USE_WIN32_IDN`): on Windows without asking, as both
# reference Windows builds have them; refused elsewhere.
win-idn = ["curl-idn2/win-idn"]
# Host names converted by libidn2 on Windows, in place of its own
# conversions (C's Windows build with `USE_LIBIDN2`).
libidn2 = ["curl-idn2/libidn2"]
# Peers verified by Apple's SecTrust where OpenSSL cannot (C's
# `USE_APPLE_SECTRUST`).
apple-sectrust = ["curl-openssl?/apple-sectrust"]
# The system's own store of certificates is the default trust store where
# a transfer names none (C's `CURL_CA_NATIVE`).
native-ca = ["curl-core/native-ca", "curl-openssl?/native-ca", "curl-gnutls?/native-ca"]
# Windows' Unicode build (C's `ENABLE_UNICODE`): the command line and the
# names of files in UTF-8, through the system's UTF-16 calls.
unicode = ["curl-core/unicode"]

[dependencies]
curl-alloc = { version = "0.1.0", path = "../curl-alloc" }
curl-core = { path = "../curl-core" }
curl-openssl = { path = "../curl-openssl", optional = true }
curl-schannel = { path = "../curl-schannel", optional = true }
curl-gnutls = { path = "../curl-gnutls", optional = true }
curl-psl = { path = "../curl-psl" }
curl-ares = { path = "../curl-ares", optional = true }
curl-idn2 = { path = "../curl-idn2" }
curl-libssh = { path = "../curl-libssh", optional = true }
curl-libssh2 = { path = "../curl-libssh2", optional = true }
curl-ldap = { path = "../curl-ldap" }
curl-nghttp2 = { path = "../curl-nghttp2" }
curl-ngtcp2 = { path = "../curl-ngtcp2", optional = true }
curl-brotli = { path = "../curl-brotli" }
curl-zlib = { path = "../curl-zlib" }
curl-zstd = { path = "../curl-zstd" }
libc = "0.2"
# Linked by curl-openssl already: here for the build script, which learns
# from it whether the library is LibreSSL (`cfg(libressl)`).
openssl-sys = { version = "0.9.118", optional = true }

# Kerberos and SPNEGO: MIT krb5's GSS-API, or on Windows SSPI, as C's
# builds have them.
[target.'cfg(not(windows))'.dependencies]
curl-gssapi = { path = "../curl-gssapi" }

# Winsock's socket addresses, which an opener is handed; the names the
# debug build's `curl_dbg_fopen` opens, read as the build reads a name.
[target.'cfg(windows)'.dependencies]
curl-os = { path = "../curl-os", features = ["fs"] }
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }
curl-sspi = { path = "../curl-sspi" }

[dev-dependencies]
# The `script:` test protocol, for bodies sent again.
curl-core = { path = "../curl-core", features = ["test-util"] }
# The TLS server of the tests of the application's hands on OpenSSL, and
# the OpenSSL functions they call on what they are handed.
openssl = "0.10.82"
openssl-sys = "0.9.118"

[lints]
workspace = true

[build-dependencies]
cc = "1.9.0"
