[package]
name = "curl-schannel"
description = "Schannel for the curl rewrite: TLS through Windows' SSPI, and its certificate checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Windows' own TLS: on any other system the crate is empty.
[target.'cfg(windows)'.dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }
curl-os = { path = "../curl-os", features = ["fs"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
] }

[lints]
workspace = true
