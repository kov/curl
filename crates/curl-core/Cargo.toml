[package]
name = "curl-core"
description = "The Rust API of the curl rewrite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The counterpart of the C debug build: reports the `Debug` feature, and
# will carry the debug-only behaviours the test suite relies on.
debug-hooks = []
# Test doubles for other crates' tests: the manual clock.
test-util = []
# The threaded resolver as the system's (C's `--enable-threaded-resolver`):
# a pool of threads per multi, in place of the resolver that answers at
# once.
threaded-resolver = []

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-os = { path = "../curl-os", features = ["net", "fs"] }

[dev-dependencies]
curl-alloc = { path = "../curl-alloc", features = ["debug-hooks"] }
# The integration tests need the test doubles without asking for them.
curl-core = { path = ".", features = ["test-util"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[[test]]
name = "torture"
# The tracker's limit is process-wide and fails the harness's own
# allocations too.
harness = false

[lints]
workspace = true
