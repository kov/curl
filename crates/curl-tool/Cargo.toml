[package]
name = "curl-tool"
description = "The curl command-line tool, on curl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "curl"
path = "src/main.rs"

[features]
# Answers names by c-ares (C's `--enable-ares`), unless the threaded resolver
# is chosen; one or the other is needed.
default = ["c-ares", "libssh", "openssl"]
# One TLS library, chosen as the library is built, with the HTTP/3
# library and the Ed25519 that go with it: curl-backends' features, which
# say what each means.
openssl = ["openssl-tls", "curl-backends/openssl"]
quiche = ["openssl-tls", "curl-backends/quiche"]
# The OpenSSL library, which `openssl` and `quiche` both mean.
openssl-tls = ["curl-backends/openssl-tls"]
gnutls = ["curl-backends/gnutls"]
mbedtls = ["curl-backends/mbedtls"]
rustls = ["curl-backends/rustls"]
wolfssl = ["curl-backends/wolfssl"]
schannel = ["curl-backends/schannel"]
c-ares = ["curl-backends/c-ares"]
# One SSH library for SCP and SFTP: libssh or libssh2.
libssh = ["curl-backends/libssh"]
libssh2 = ["curl-backends/libssh2"]
# GNU GSS in place of MIT krb5 for Kerberos and SPNEGO (C's
# `HAVE_GSSGNU`).
gnu-gss = ["curl-backends/gnu-gss"]
# The debug test build: track allocations as the C tool's debug build does.
debug-hooks = ["curl-alloc/debug-hooks", "curl-backends/debug-hooks", "curl-core/debug-hooks", "curl-os/debug-hooks"]
# The threaded resolver as the system's (C's `--enable-threaded-resolver`).
threaded-resolver = ["curl-backends/threaded-resolver"]
# Host names converted by Apple's ICU in place of libidn2 (C's
# `USE_APPLE_IDN`).
apple-idn = ["curl-backends/apple-idn"]
# Host names converted by Windows' IdnToAscii and IdnToUnicode in place
# of libidn2 (C's `USE_WIN32_IDN`): on Windows without asking, as both
# reference Windows builds have them; refused elsewhere.
win-idn = ["curl-backends/win-idn"]
# Host names converted by libidn2 on Windows, in place of its own
# conversions (C's Windows build with `USE_LIBIDN2`).
libidn2 = ["curl-backends/libidn2"]
# Peers verified by Apple's SecTrust where OpenSSL cannot (C's
# `USE_APPLE_SECTRUST`).
apple-sectrust = ["curl-backends/apple-sectrust"]
# The system's own store of certificates is the default trust store where
# a transfer names none (C's `CURL_CA_NATIVE`).
native-ca = ["curl-backends/native-ca"]
# OpenSSL's configuration file is never read (C's
# `CURL_DISABLE_OPENSSL_AUTO_LOAD_CONFIG`).
disable-openssl-auto-load-config = ["curl-backends/disable-openssl-auto-load-config"]
# Windows' Unicode build (C's `ENABLE_UNICODE`): the command line and the
# names of files in UTF-8, through the system's UTF-16 calls.
unicode = ["curl-core/unicode"]

[[test]]
name = "memdebug"
required-features = ["debug-hooks"]

[[test]]
name = "long_names"
required-features = ["debug-hooks"]

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }
# The libraries the build is linked with, which the features above choose.
curl-backends = { path = "../curl-backends", default-features = false }
curl-os = { path = "../curl-os", features = ["args", "fs", "net"] }
curl-psl = { path = "../curl-psl" }
curl-idn2 = { path = "../curl-idn2" }
curl-ldap = { path = "../curl-ldap" }
curl-nghttp2 = { path = "../curl-nghttp2" }
curl-brotli = { path = "../curl-brotli" }
curl-zlib = { path = "../curl-zlib" }
# C's `errno` values, which the tool's messages are chosen by.
libc = "0.2"
curl-zstd = { path = "../curl-zstd" }
# `#[mutants::skip]`, for cargo-mutants: an attribute and nothing else.
mutants = "0.0.4"

# Kerberos and SPNEGO: MIT krb5's or GNU GSS's GSS-API, or on Windows
# SSPI, as C's builds have them.
[target.'cfg(not(windows))'.dependencies]
curl-gssapi = { path = "../curl-gssapi" }
[target.'cfg(windows)'.dependencies]
curl-sspi = { path = "../curl-sspi" }

[dev-dependencies]
# The tests build what the core reports, and their servers' bounded accept.
curl-core = { path = "../curl-core", features = ["test-util"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
