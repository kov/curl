# cargo-mutants: plants faults in the code and checks a test fails for each.
# Run at the end of a large piece of work, scoped to what it changed, from
# a clean worktree (cargo-mutants copies the source tree, and the main one
# carries gigabytes of ignored test files) and under a memory cap (a planted
# fault can allocate without bound faster than the timeout fires):
#   git worktree add --detach build/mutants-tree <commit>
#   git diff <base> <commit> > build/mutants.diff
#   cd build/mutants-tree && TMPDIR=<a directory on disk> \
#     systemd-run --user --scope -p MemoryMax=6G \
#     -p MemorySwapMax=0 -p OOMPolicy=continue \
#     cargo mutants -o .. --in-diff ../mutants.diff -p <crate> --features <f>
# (the features each crate's tests need: `debug-hooks` for curl-alloc, whose
# tracker is built only with it, for curl-sys-abi, and for curl-tool, whose
# terminal tests need the debug build's `CURL_ISATTY`; `test-util,debug-hooks`
# for curl-core. Without them those mutants survive or are never built.)
# (Some code is reached only from another crate's tests: run curl-core's
# mutants with `--test-package curl-core --test-package curl-openssl
# --features curl-core/test-util,curl-core/debug-hooks`, as the TLS layer's
# context is the OpenSSL backend's to use, and curl-openssl's with
# `--test-package curl-openssl --test-package curl-sys-abi`, as an
# application's verify callback waits only through the C ABI; cargo
# refuses curl-sys-abi's features for a curl-openssl run.)
# (The copy is made in `TMPDIR`: where `/tmp` is a small tmpfs it fills, and
# its memory is the machine's. The worktree must hold no build output of its
# own, such as a sabotage sweep's `build/target`: it is copied too, without
# its execute bits, and every build script then fails "Permission denied".)
# (`OOMPolicy=continue` kills only the runaway test, which then counts as
# caught; the default stops the whole run.)
#   git worktree remove build/mutants-tree
# A surviving mutant is code no test checks: add the test, or add it to
# `exclude_re` below with a comment saying why it changes nothing observable.

# Generated code is checked against its generator, not by its own tests.
exclude_globs = [
    "crates/curl-core/src/error/kinds.rs",
    "crates/curl-core/src/url/schemes.rs",
    "crates/curl-sys-abi/src/error_codes.rs",
    "crates/curl-sys-abi/src/ffi.rs",
    "crates/curl-tool/src/options/errors.rs",
    "crates/curl-tool/src/options/help.rs",
    "crates/curl-tool/src/options/table.rs",
    "**/c_tests.rs",
    "**/c_order.rs",
]


# A planted fault can turn a loop infinite; fail it instead of waiting.
timeout_multiplier = 3.0

# Mutants that change nothing observable, each with its reason. Matched
# against "file:line:col: description"; anchor on the function, not the
# line, so an edit cannot move an exclusion onto other code.
exclude_re = [
    # Negotiate's output is done whenever it returns a request to send (a
    # token went: `CURL_NEGO_AUTH_DONE`), so `!done` alone already makes
    # its probe false.
    'curl-core/src/proto/http1/auth\.rs:.*: delete ! in PeerAuth::negotiated$',
    # The build claims SPNEGO: asking whether it does is always true.
    'curl-sys-abi/src/getinfo\.rs:.*: replace spnego -> bool with true$',
    'curl-tool/src/options/parse\.rs:.*: replace claims_spnego -> bool with true$',
    # The room reserved for the token's base64: one wrong only makes the
    # fallible pushes grow the buffer.
    'curl-core/src/proto/http/negotiate\.rs:.*: replace \* with (\+|/) in output$',
    # A side is `Recv` only after a challenge was taken, which leaves it
    # challenged until this output clears it.
    'curl-core/src/proto/http/negotiate\.rs:.*: replace match guard side\.challenged with true in output$',
    # The TLS layer is the only one outside the tests: no layer that takes
    # `Layer`'s default is ever asked for a channel binding.
    'curl-core/src/conn/layer\.rs:.*: replace Layer::channel_binding -> .*$',
    # The backend's id is part of the session cache's key: with one
    # backend, any id keys every session alike.
    'curl-openssl/src/ssl\.rs:.*: replace <impl core::fmt::Display for Id>::fmt -> core::fmt::Result with Ok\(Default::default\(\)\)$',
    # The engine shuts a session down once, and only after its handshake;
    # what is pending after the goodbye is never read.
    'curl-openssl/src/ssl\.rs:.*: replace (\|\| with &&|!= with ==) in <impl TlsSession for Session>::shutdown$',
    # The goodbye runs on the multi's own handle, as C's runs on its admin
    # handle (`Curl_cshutdn_terminate`), so its trace reaches no
    # application; and the connection is closed however it ends. These
    # change only which lines that trace says, whether a close_notify goes
    # to a peer already gone, or how often the socket is waited for. The
    # peer tests in goodbye.rs check the close_notify arrives, and that an
    # aborted transfer sends none.
    'curl-openssl/src/ssl\.rs:.*: (replace (==|!=) with (!=|==)|replace <= with >|delete -) in Session::goodbye$',
    # A key of its certificate's signer's kind, the signature naming no
    # digest, that names a default digest of its own: the keys OpenSSL
    # signs with without a digest name none (Ed25519's and Ed448's are
    # "UNDEF"), so the line saying so is not reached, and the binding
    # fails either way.
    'curl-openssl/src/x509\.rs:.*: (replace && with \|\||replace > with (==|<|>=)|delete !) in key_names_no_digest$',
    'curl-openssl/src/x509\.rs:.*: .* in say_unavailable$',
    # Standard input's copy is never 0, as 0 is the descriptor copied; and
    # `dup2` returns the descriptor it made, standard error's 2.
    'curl-os/src/fs\.rs:.*: replace < with <= in (stdin|stderr_to)$',
    # A reservation size: one byte short only makes the NUL's push grow
    # the buffer.
    'curl-os/src/resolve\.rs:.*: replace \+ with \* in lookup$',
    # Freeing what C allocated: only a leak checker sees it not freed, and
    # the tests run under none that sees C's heap (Miri cannot run FFI).
    # A successful `getaddrinfo` never leaves the list null.
    'curl-os/src/resolve\.rs:.*: (replace <impl Drop for List>::drop with \(\)|delete ! in <impl Drop for List>::drop)$',
    'curl-psl/src/lib\.rs:.*: replace <impl Drop for Ctx>::drop with \(\)$',
    # OpenSSL's init flags are disjoint bits, as `crypto.h` defines them:
    # xor of them is their or, the same value.
    'curl-openssl/src/sys\.rs:.*: replace \| with \^( in init_ssl)?$',
    # The headers' flags each of `ffi.rs`'s constants joins are disjoint
    # bits, as `bio.h`, `asn1.h` and `x509.h` define them.
    'curl-openssl/src/ffi\.rs:.*: replace \| with \^$',
    # `SSL_OP_ALL`, `SSL_OP_NO_TICKET` and `SSL_OP_NO_COMPRESSION` are
    # disjoint bits, as `ssl.h` defines them.
    'curl-openssl/src/ssl\.rs:.*: replace \| with \^ in Session::step1$',
    # A memory BIO's data is null only while it holds nothing, and what
    # it holds is an empty slice either way.
    'curl-openssl/src/x509\.rs:.*: replace (> with >=|&& with \|\|) in MemBio::bytes$',
    # `X509_NAME_print_ex` gives the bytes it wrote or -1, and a name
    # prints none or at least two (`C=`): 1 is never given either.
    'curl-openssl/src/x509\.rs:.*: delete - in name_line$',
    # `ASN1_STRING_to_UTF8` allocates whenever it gives a length.
    'curl-openssl/src/x509\.rs:.*: replace match guard !owned\.is_null\(\) with true in common_name$',
    # With no protocol chosen OpenSSL gives a null pointer and a length
    # of 0, with one neither: either half of the guard decides it.
    'curl-openssl/src/ssl\.rs:.*: replace (> with >=|&& with \|\|) in Session::negotiated$',
    # A reservation size: a wrong one only makes the pushes grow the
    # vector.
    'curl-openssl/src/certinfo\.rs:.*: replace (\* with (\+|/)|\+ with (-|\*)) in hex$',
    # Called for a DER blob alone, as C calls it: a PEM blob is read as a
    # chain (`use_certificate_chain_blob`).
    'curl-openssl/src/cert\.rs:.*: delete match arm FileType::Pem in use_certificate_blob$',
    # `X509_V_FLAG_CRL_CHECK` and `X509_V_FLAG_CRL_CHECK_ALL` are disjoint
    # bits (`x509_vfy.h`).
    'curl-openssl/src/x509\.rs:.*: replace \| with \^ in populate_store$',
    # Whether a provider a PKCS#11 URI loaded is kept in the session's
    # selection or only for the call changes when it is let go of, after
    # the context was made with what was selected before.
    'curl-openssl/src/engine\.rs:.*: (replace Crypto::is_empty -> bool with (true|false)|replace && with \|\| in Crypto::is_empty)$',
    # `ENGINE_set_default` gives 1 or 0.
    'curl-openssl/src/engine\.rs:.*: replace > with >= in Crypto::set_default$',
    # The core reads only that the session failed, and says nothing of
    # the error, which the session said itself.
    'curl-openssl/src/ssl\.rs:.*: replace != with == in said$',
    # Only an asynchronous engine asks to wait for its job, and no engine
    # this build meets is one.
    'curl-openssl/src/ssl\.rs:.*: delete match arm SSL_ERROR_WANT_ASYNC in Session::step2$',
    # A write reads only to finish a TLS 1.2 renegotiation the server
    # started while the client was still sending, which no test can time;
    # and fails with the library's own error only on a session already
    # failed or shut down, which the transfer no longer writes to.
    'curl-openssl/src/ssl\.rs:.*: delete match arm openssl_sys::SSL_ERROR_(WANT_READ|SSL) in <impl TlsSession for Session>::send$',
    # Asked only after a read that would block, which leaves it false.
    'curl-openssl/src/ssl\.rs:.*: replace <impl TlsSession for Session>::pending -> bool with false$',
    # `SSL_get_error` says `SSL_ERROR_NONE` only for a read that gave
    # bytes; a BIO that would block sets its retry flag, which makes the
    # answer a want, never another; and a read of 0 always queues an
    # error (OpenSSL 3's unexpected EOF), so it is never 0 and silent.
    'curl-openssl/src/ssl\.rs:.*: (delete match arm openssl_sys::SSL_ERROR_NONE|replace match guard below == Below::Again with false|replace < with <=) in Session::read_result$',
    # `LayerQuery` has no variant, so `Layer::query`'s default body can
    # never run.
    'conn/layer\.rs:.*: replace Layer::query -> Option<LayerAnswer> with None$',
    # A debug format nothing reads.
    'easy\.rs:.*: replace <impl fmt::Debug for Private>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    'conn/io\.rs:.*: replace <impl fmt::Debug for Sock>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    'curl-zlib/src/lib\.rs:.*: replace <impl std::fmt::Debug for Inflater>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)$',
    # Seeking a file just opened to its start changes nothing.
    'proto/file\.rs:.*: replace > with >= in Request::download$',
    # Joining parts whose bits cannot overlap: `|` and `^` agree.
    'url/host\.rs:.*: replace \| with \^ in (ipv4|pton6)$',
    'url/encode\.rs:.*: replace \| with \^ in (escaped_byte|decode)$',
    'proto/http1/auth\.rs:.*: replace \| with \^ in base64$',
    'curl-os/src/net\.rs:.*: replace \| with \^ in (connect|open)$',
    'curl-sys-abi/src/sockets\.rs:.*: replace \| with \^ in SockaddrEx::tcp$',
    'curl-os/src/fs\.rs:.*: replace \| with \^ in (open|open_write)$',
    # 0x80 is in no list of invalid bytes, so it stays allowed either way.
    'url/host\.rs:.*: replace < with <= in invalid_host_byte$',
    # `ipv4` is only given a host that starts with a digit, so it never
    # meets the end of its input before the first part.
    'url/host\.rs:.*: replace > with >= in ipv4$',
    # The user, password and options separators never share an index.
    'url/mod\.rs:.*: replace > with >= in Url::parse_login$',
    # A one-byte path is `/` (a file: path always starts with one), which
    # reads back the same whether it is stored or not.
    'url/mod\.rs:.*: replace \+ with \* in path_part$',
    # Zeroing a password as it is freed: nothing safe can read it after.
    'url/mod\.rs:.*: replace <impl Drop for Url>::drop with \(\)$',
    # The default `timer` is already `Ok(())` and the default `notify` does
    # nothing; with them, whether timer calls are recorded cannot be seen.
    'multi/mod\.rs:.*: replace MultiEvents::timer -> Result<\(\), Abort> with Ok\(\(\)\)$',
    'multi/mod\.rs:.*: replace MultiEvents::wants_timer -> bool with true$',
    'multi/mod\.rs:.*: replace MultiEvents::notify with \(\)$',
    # The default `socket` is already `Ok(())`.
    'multi/mod\.rs:.*: replace MultiEvents::socket -> Result<\(\), Abort> with Ok\(\(\)\)$',
    # Closing a real socket is dropping it, which the moved-in box does
    # anyway.
    'conn/io\.rs:.*: replace <impl Net for SystemNet>::close with \(\)$',
    # Only a fake socket's readiness is known without a poll, and the fake
    # network polls with no timeout; the sum only sizes a reservation.
    'conn/io\.rs:.*: replace (> with (==|>=|<)|\+ with (-|\*)) in poll_together$',
    # One socket alone is polled without a list: the same poll, made
    # without allocating.
    'conn/io\.rs:.*: replace match guard fds\.is_empty\(\) with false in poll_together$',
    # A fake peer: no test sends more requests than its conversation has
    # replies.
    'conn/io\.rs:.*: replace < with <= in Wire::answering$',
    # A fake socket ready exactly at the timeout is reported or not; a real
    # poll may do either.
    'conn/io\.rs:.*: replace < with <= in <impl Net for FakeNet>::poll$',
    # The walk feeds only the debug build's invariant check.
    'multi/sockets\.rs:.*: replace SocketTable<S>::each_user with \(\)$',
    # The count only sizes a reservation.
    'multi/wait\.rs:.*: replace \+= with \*= in Multi<H>::wait$',
    # With no socket function what the table records goes with the multi.
    'curl-sys-abi/src/multi\.rs:.*: replace <impl MultiEvents<CHost> for Cleanup<._>>::wants_sockets -> bool with true$',
    # The debug build's invariant check fails only on a broken invariant;
    # the sabotage entries witnessed by the property test show it does.
    'multi/(mod|check)\.rs:.*: replace Multi<H>::check(_invariants)? with \(\)$',
    # Only the invariant check asks the transfer whether output is held;
    # the sabotage entry that leaves a completed transfer held shows the
    # check fires.
    'multi/state\.rs:.*: replace TransferState::holds_output -> bool with true$',
    # When delivered bytes are compacted away is a choice of threshold:
    # one byte either way changes nothing observable.
    'deliver/held\.rs:.*: replace > with >= in HeldOutput::consume$',
    # With six records made, the oldest is at index 0 either way.
    'progress/mod\.rs:.*: replace < with <= in oldest_record$',
    # A size of exactly 10000 has the same share counted either way.
    'progress/meter\.rs:.*: replace > with >= in percent$',
    # Running a transfer clears its dirty row, so resuming the walk at
    # the row itself finds the same next one.
    'multi/mod\.rs:.*: replace \+ with \* in Multi<H>::run_dirty$',
    # Reserving more than needed.
    '(sched|timers|notify)\.rs:.*: replace (< with <=|- with \+) in (RowSet|TimerQueue<T>|NotifyQueue)::reserve$',
    # The waker's eventfd is nonblocking: its reads and writes never wait,
    # so no signal can interrupt one.
    'curl-os/src/wake\.rs:.*: delete match arm io::ErrorKind::Interrupted in Waker::(wake|drain)$',
    # Sequence numbers are unique: two entries never compare equal.
    'multi/timers\.rs:.*: replace < with <= in Entry<T>::before$',
    # Past the depth limit every call is refused whether the callback is
    # counted or not, and the count comes back down when it returns.
    'curl-sys-abi/src/gate/mod\.rs:.*: replace < with <= in MultiStack::lend$',
    # Without a timer function `ShimEvents::timer` does nothing: whether
    # the core asks it cannot be seen.
    'curl-sys-abi/src/multi\.rs:.*: replace <impl MultiEvents<CHost> for ShimEvents<._>>::wants_timer -> bool with true$',
    # The private multi only drives the handle's own transfer, and only
    # an allocation the tests cannot fail on its own reports OutOfMemory.
    'curl-sys-abi/src/easy\.rs:.*: delete match arm MultiErrorKind::OutOfMemory in perform$',
    # A private multi kept past an add is freed with the handle instead;
    # nothing else can see it.
    'curl-sys-abi/src/easy\.rs:.*: replace ShimEasy::drop_private with \(\)$',
    # `c_long` is 64 bits here, so every time fits it; the clamps serve
    # the targets where it is 32.
    'curl-sys-abi/src/getinfo\.rs:.*: replace < with (==|>|<=) in long_time$',
    # Reservation sizes: a wrong one only changes how often the vector
    # grows.
    'proto/http1/auth\.rs:.*: replace (\+ with \*|\* with (\+|/)) in Credentials::basic$',
    'proto/http1/request\.rs:.*: replace - with \+ in render_h1$',
    'url/mod\.rs:.*: replace \+ with \* in Url::whole$',
    'curl-sys-abi/src/(headers|getinfo)\.rs:.*: replace \+ with (-|\*) in (HeaderOut::show|effective_url)$',
    # `Curl_compareheader`'s arithmetic where it cannot change the answer:
    # a line as long as the name has an empty value, which says nothing;
    # a comma at the value's last byte or past it ends the search either
    # way; the walk skips the comma it lands on; and a step that takes it
    # exactly to the value's end leaves nothing to compare.
    'proto/http1/fields\.rs:.*: replace (< with <=|\+ with (-|\*)|> with >=) in header_says$',
    # C's `HD_IS_AND_SAYS` length check before `Curl_compareheader`: every
    # header line carries its line ending, so one as long as name and
    # token says nothing either way.
    'proto/http1/framing\.rs:.*: replace (> with >=|\+ with -) in says$',
    # Only a first line that cannot be a status line is told apart.
    'proto/http1/response\.rs:.*: replace >= with < in HeadParser::looks$',
    # A line held at done is counted in the request's own counts, which
    # nothing reads once it is done.
    'proto/http1/response\.rs:.*: replace HeadParser::count_held -> Result<\(\), HeadError> with Ok\(\(\)\)$',
    # The version below none is matched before this arm can see it.
    'curl-sys-abi/src/setopt/mod\.rs:.*: replace < with <= in http_version$',
    # Joining disjoint `CURLAUTH_*` bits: `|` and `^` agree.
    'curl-sys-abi/src/getinfo\.rs:.*: replace \| with \^ in auth_mask$',
    'curl-sys-abi/src/setopt/mod\.rs:.*: replace \| with \^ in (auth_methods|socks5_auth)$',
    # The core offers the fields' reader no more than is left of their
    # size, which they always have: `len - read` is never the smaller.
    'curl-sys-abi/src/callbacks\.rs:.*: replace - with \+ in <impl ReadHandler for Fields>::read$',
    # A reservation size: a wrong one only makes the push grow the vector.
    'curl-sys-abi/src/getinfo\.rs:.*: replace \+ with \* in c_string$',
    # A share with neither lock function gets a watch that calls none, and
    # the functions cannot change while a handle holds the share.
    'curl-sys-abi/src/share\.rs:.*: replace match guard sh\.settings\(\)\.lock\.is_some\(\) \|\| sh\.settings\(\)\.unlock\.is_some\(\) with true in set_core$',
    # `SocketKey::BAD` is a constant, so the mutant names no function; it
    # fills the slots of a pollset past its length, which nothing reads.
    'conn/io\.rs:.*: delete -$',
    # The earliest expiry only lets a sweep return before it looks: one
    # that returns at that very second, or never, or a recount that leaves
    # it at 0 or unknown, sweeps in full, which finds no cookie expired
    # before the earliest does.
    'cookie\.rs:.*: replace (< with (==|<=)|!= with ==) in Jar::sweep$',
    # Cookies without a domain come only from files and the application,
    # whose lines are taken as secure: the overlay check they would feed
    # is for cookies from a connection that is not.
    'cookie\.rs:.*: delete match arm \(None, None\) in domains_overlap$',
    # A reservation size: one byte short only makes the NUL's push grow
    # the buffer.
    'save\.rs:.*: replace \+ with \* in c_path$',
    # `choose` joins disjoint bits, where `|` and `^` agree; `majority` is
    # the majority with either of its `^` made `|`, as `&` binds tighter
    # than `^` and `^` than `|`.
    'hash\.rs:.*: replace (\| with \^|\^ with \|) in (choose|majority)$',
    # A literal copied for an entry that does not match the host belongs
    # to an entry discarded whole at the next one, before anything reads
    # it: copying it only allocates.
    'netrc\.rs:.*: replace match guard kept with true in literal$',
    # Names of equal length are compared above: past it `<` and `<=` agree.
    'conn/proxy\.rs:.*: replace < with <= in match_host$',
    # Every HTTPS proxy type is refused alike, this build having no TLS:
    # which of them an `https` scheme keeps cannot be seen yet.
    'conn/proxy\.rs:.*: delete match arm ProxyType::Https2 \| ProxyType::Https3 in of_scheme$',
    # `none` is the default set, by name.
    'coding\.rs:.*: replace Decoders::none -> Decoders with Default::default\(\)$',
    # The default `added` already does nothing.
    'multi/mod\.rs:.*: replace MultiEvents::added with \(\)$',
    # `AuthMethods::ANY` joins disjoint bits: `|` and `^` agree. A
    # constant names no function, so the line's text is the anchor.
    'options/mod\.rs:.*: replace \| with \^$',
    # Only a system clock set before 1970 takes the negative arm.
    'time\.rs:.*: delete - in <impl Clock for SystemClock>::unix_time$',
    # `retry_request` asks itself whether the connection was reused: a
    # send failing on a fresh one ends the transfer either way.
    'multi/state\.rs:.*: replace match guard x\.lease\.conn\(\)\.reused\(\) with true in step$',
    # Nothing read leaves the buffer empty, and the send loop it returns
    # to has spent its one read: it stops all the same.
    'proto/http\.rs:.*: replace > with >= in Request::fill$',
    # A debug form nothing reads.
    'mime/mod\.rs:.*: replace <impl std::fmt::Debug for Boundary>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)$',
    # A source that keeps no head lines and one that hands out a fresh,
    # empty record each time it is asked keep nothing alike.
    'mime/mod\.rs:.*: replace MimeSource::sent_head -> Option<&SentHead> with Some\(Box::leak\(Box::new\(Default::default\(\)\)\)\)$',
    # The cursors' depth only bounds their own making: `prepare`, run on
    # the same tree right after, refuses a level sooner whatever it counts.
    'mime/read\.rs:.*: replace (> with (==|>=)|\+ with \*) in cursor$',
    # `attachment` is dropped from a part without a name, so the type
    # test that gives it one there changes nothing (as in C).
    'mime/read\.rs:.*: delete ! in disposition_line$',
    # Reading into no room reads nothing, which ends the loop as the
    # file's end does; and nothing in the library installs a signal
    # handler, so no read is interrupted.
    'mime/read\.rs:.*: (replace < with <=|replace match guard e\.kind\(\) == std::io::ErrorKind::Interrupted with false) in fread$',
    # Content is never read into no room: a part is read only while room
    # is left, and an encoder's input only while its buffer has space.
    'mime/read\.rs:.*: replace match guard buf\.is_empty\(\) with false in read_content$',
    # Three bytes joined at disjoint bits, where `^` is `|`; and the line
    # position after the last group, flushed at the end, is cleared
    # before it is read again (`+=` elsewhere in it is pinned by the
    # pieces C gives).
    'mime/read\.rs:.*: replace (\| with \^|\+= with \*=) in base64$',
    # A group cut short only returns early: `read_encoded` calls the
    # encoder again with the room left. And the input is moved to the
    # buffer's start before each read, the flush following the read that
    # finds the end, so what is held there starts at 0 (`end - beg`
    # elsewhere in it is pinned by the pieces C gives).
    'mime/read\.rs:.*: replace (-= with /=|- with \+) in base64$',
    # A debug form nothing reads.
    'options/mod\.rs:.*: replace <impl fmt::Debug for Cold<T>>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    # The methods are disjoint bits: `|` and `^` agree.
    'options/mod\.rs:.*: replace \| with \^ in AuthMethods::single$',
    # No tokens is no debt: the wait is the step's rest either way; and a
    # step's end reached exactly rounds up to no wait.
    'progress/rate\.rs:.*: (replace < with <= in Bucket::wait_ms|replace > with >= in Bucket::next_step_ms)$',
    # Zeroing a key and a signature as they are freed: nothing safe can
    # read them after.
    'proto/http/httpsig\.rs:.*: replace <impl Drop for (Secret|Mac)>::drop with \(\)$',
    # A reservation size, and nibbles joined at disjoint bits.
    'proto/http/httpsig\.rs:.*: replace (/ with (%|\*)|\| with \^) in decode_hex_key$',
    # Lent bytes give none at their end, which ends the loop as reaching
    # it does; and nibbles joined at disjoint bits.
    'proto/http/sigv4\.rs:.*: (replace < with <= in post_fields_hash|replace \| with \^ in normalize)$',
    # A reservation size: a short one only makes a push grow the name.
    'save\.rs:.*: replace \+ with (-|\*) in replace$',
    # Counting no bytes adds nothing, and the update the bucket's drain
    # makes earns no more than the next would.
    'deliver/mod\.rs:.*: replace > with >= in BodyAccountant::counted$',
    # The write types' bits are disjoint, and a type is ended once, so
    # joining them by xor is joining them by or.
    'deliver/mod\.rs:.*: replace \| with \^ in WriteType::(of|eos)$',
    # Held output is replayed when the kind changes between body and not
    # body: a test inverted on both sides of the comparison compares alike.
    'deliver/mod\.rs:.*: replace == with != in is_body$',
    # More descriptors than fit on the stack are listed on the heap: the
    # same descriptors are polled whichever holds them.
    'conn/io\.rs:.*: replace match guard n <= ON_STACK with false in poll_together$',
    'multi/wait\.rs:.*: replace match guard (wanted|n_fds) <= ON_STACK with false in Multi<H>::wait$',
    # A known size read to its end sets `seen_eos`, and the next read
    # returns before reading: one that finds nothing has read less than
    # the size, which a tree's closing boundary keeps above 0. C's check
    # of it, kept, is always true.
    'mime/read\.rs:.*: (replace < with <= in MimeReader::(read|took)|replace match guard self\.read < size with true in MimeReader::took)$',
    # A share's pool is used to find, check and close connections, never
    # to make one: no address is scoped through it.
    'multi/cx\.rs:.*CloseLater<._>>::link_local_scope',
    # Echo is turned off on the controlling terminal, which a test run has
    # none of to own: opening `/dev/tty`, its settings, reading from it
    # and putting them back are reached only from a terminal, by hand.
    'curl-os/src/terminal\.rs:.*Unechoed',
    # glibc's `strerror_r` writes a text for every number, known or not:
    # the fallback for one that writes none is never taken either way.
    'curl-os/src/error\.rs:.*: replace != with == in ErrorText::of_code$',
    # `close` of a descriptor owned and open fails only where the file
    # system reports a held write's error then, which no test has.
    'curl-os/src/fs\.rs:.*: (replace close -> io::Result<\(\)> with Ok\(\(\)\)|replace < with > in close)$',
    # Only `read_whole`'s reader has no handlers to call, and it never
    # starts over.
    'mime/read\.rs:.*: replace <impl Calls for NoCalls>::rewind -> Result<\(\), RewindFailed> with Ok\(\(\)\)$',
    # Without a transfer no count of lifts is there: the one given is
    # already the default, and no handler is called to pause.
    'mime/read\.rs:.*: replace <impl Calls for NoCalls>::lifts -> Lifts with Default::default\(\)$',
    # A pool section closes connections and never resolves a name: it
    # lends the network's resolver only to be a whole network.
    'multi/cx\.rs:.*: replace <impl Net for CloseLater<._>>::with_resolver with \(\)$',
    # A transfer is in `Done` only inside a step, while its run is out of
    # its slot where nothing asks for its lease; the invariant check
    # asserts it never rests there.
    'multi/state\.rs:.*: delete match arm TransferState::Done\(d\) in TransferState::lease$',
    # A reservation size in the test scheme's decoder.
    'proto/script\.rs:.*: replace \* with (\+|/) in <impl Decoder for Expand>::decode$',
    # Where a run of bytes copied as is ends: cut one byte earlier or at
    # the escape itself, the bytes written are the same.
    'url/encode\.rs:.*: replace (&& with \|\||> with >=) in reencode$',
    # One more look at the end finds nothing there to read as an escape.
    'url/encode\.rs:.*: replace < with <= in uppercase_hex$',
    # A fake peer hanging up on a request it has no reply for: whether it
    # does so at the request's first send or once its head is whole, the
    # request is never answered.
    'conn/io\.rs:.*: replace > with >= in <impl Socket for FakeSocket>::send$',
    # A URL with none of `{}[]` globs to itself, one fixed part.
    'curl-tool/src/glob\.rs:.*: replace has_patterns -> bool with true$',
    # At the URL's end the inner loop reads nothing and the body breaks.
    'curl-tool/src/glob\.rs:.*: replace < with <= in Glob::parse_all$',
    # Neither factor is ever below 1: the amount starts at 1, and a set or
    # range makes at least one URL.
    'curl-tool/src/glob\.rs:.*: replace \|\| with && in multiply$',
    # At the text's end the line is empty and holds no entry.
    'curl-tool/src/config\.rs:.*: replace < with <= in entries$',
    # A format never holds a zero: an argument cannot, and a file's is
    # read without them.
    'curl-tool/src/write_out\.rs:.*: delete match arm 0 in separator$',
    # The ball's tick is only ever read modulo 200.
    'curl-tool/src/bar\.rs:.*: replace % with \+ in State::fly$',
    # Bits that never overlap: or and exclusive or make the same mask.
    'curl-tool/src/easysrc\.rs:.*: replace \| with \^ in auth_mask$',
    'curl-tool/src/operate\.rs:.*: replace \| with \^ in http_setopts$',
    # A reservation size: a short one only makes a push grow the list.
    'curl-tool/src/operate\.rs:.*: replace \+ with \* in credentials_and_headers$',
    # The decoder asks only after 1 MiB of output, and the manual is under
    # a third of that; nothing else could stop it.
    'curl-tool/src/hugehelp\.rs:.*: replace <impl Sink for Pieces<._>>::timed_out -> bool with true$',
    # A reservation size: `--output-dir` refuses a blank argument, so the
    # directory is never empty, and a short reservation only makes a push
    # grow the buffer.
    'curl-tool/src/operate\.rs:.*: replace \+ with (\*|-) in joined$',
    # Standard output's only name is `-`: globbed, or put in the output
    # directory, the output still goes to standard output, and the name
    # made is never read.
    'curl-tool/src/operate\.rs:.*: replace match guard !to_stdout with true in create$',
    # Asked only of an attempt `resumable` passed, a GET without `-X`:
    # only HTTP has a response code to match, and its method is GET.
    'curl-tool/src/operate\.rs:.*: replace \|\| with && in answered_resumably$',
    # Only the flag a parallel transfer's progress handler reads makes it
    # end aborted. The tool's other handlers never abort, but for a form
    # part's read of standard input failing mid-transfer: standard input
    # is read then only when it is a regular file (otherwise it was read
    # whole as the form was parsed), and a regular file's read fails
    # only on a fault of the disk.
    'curl-tool/src/operate/parallel\.rs:.*: replace match guard aborted with true in Parallel<.*>::check_finished$',
    # The tool installs no signal handler, so no read is interrupted.
    'curl-tool/src/operate\.rs:.*: replace match guard e\.kind\(\) == std::io::ErrorKind::Interrupted with false in <impl ReadHandler for UploadFile>::read$',
    'curl-tool/src/slurp\.rs:.*: replace match guard e\.kind\(\) == std::io::ErrorKind::Interrupted with false in read$',
    'curl-tool/src/form\.rs:.*: replace match guard e\.kind\(\) == std::io::ErrorKind::Interrupted with false in (header_file|stdin_part|<impl ReadHandler for StdinPart>::read)$',
    'curl-tool/src/ipfs\.rs:.*: replace match guard e\.kind\(\) == std::io::ErrorKind::Interrupted with false in first_line$',
    # No digits make no number, as the empty text parses as none.
    'curl-tool/src/options/apply\.rs:.*: replace > with >= in range$',
    # The URL is parsed guessing a scheme, so it always has one.
    'curl-tool/src/operate\.rs:.*: delete field default_scheme from struct GetOptions expression in url_proto$',
    # The URL got encodes only its host, which was encoded as it was set.
    # The gateway's host is one host decoded or not: a byte encoded that
    # a host may hold is decoded as the gateway is parsed, and any other
    # is refused as the host is set, either way.
    'curl-tool/src/ipfs\.rs:.*: delete field url_decode from struct GetOptions expression in rewrite$',
    'curl-tool/src/ipfs\.rs:.*: delete field url_encode from struct GetOptions expression in rewrite$',
    # Every caller of `part` allows a type: only a file name and an
    # encoder are ever not allowed.
    'curl-tool/src/form\.rs:.*: replace match guard !allowed\.mime_type with false in part$',
    # Standard input read as it is sent, `size` bytes of a regular file:
    # the core reads a part of known size no further once its own count
    # reaches the size, and the room left is 0 there besides; the room
    # differs only after a short read, which a regular file gives only at
    # its end.
    'curl-tool/src/form\.rs:.*: (replace match guard st\.at >= size with false|replace - with \+|replace \+= with \*=) in <impl ReadHandler for StdinPart>::read$',
    # Only `CURLFORM_BUFFERPTR` sets the buffer flags, and it refuses a
    # NULL buffer: the check is never true, whichever flag it tests.
    'curl-sys-abi/src/formdata\.rs:.*: (replace buffer_missing -> bool with false|replace & with (\||\^) in buffer_missing|replace != with == in buffer_missing)$',
    # The flags or-ed are distinct bits, where `^` is `|`.
    'curl-sys-abi/src/formdata\.rs:.*: replace \| with \^ in formadd_check$',
    # A 41st tree under the handle's is the content of a part 41 below
    # it, which the core refuses to send, as too large as this refuses
    # it: refusing it here instead changes nothing. `curl_formget`'s
    # trees are two deep at most.
    'curl-sys-abi/src/mime\.rs:.*: replace (> with (>=|==)|\+ with \*) in too_deep$',
    # A header line ends with its line end: it is never just the name
    # looked for, and an empty rest after `Location:` names nothing.
    'curl-tool/src/output\.rs:.*: replace (> with >=|< with <=) in Stream::name_from$',
    # A header line ends with its line end, so the 9 bytes left at its
    # very end are never `filename=`, nor can one follow them.
    'curl-tool/src/output\.rs:.*: replace > with >= in Stream::disposition$',
    # `CURLOPT_SSLVERSION` joins the oldest version, in the low 16 bits,
    # and the newest, above them; the SSL options each bit once: disjoint
    # bits, where `|` and `^` agree.
    'curl-tool/src/operate\.rs:.*: replace \| with \^ in ssl_setopts$',
    # A newest of 1.2 with no oldest given makes the oldest 1.2, which the
    # default oldest already is.
    'curl-tool/src/operate\.rs:.*: replace < with <= in tls_versions$',
    # `put` is reached with the buffer just written out or made, so empty,
    # and with less than a block left, so less than the buffer: on the one
    # turn a stream that is not line buffered takes, the room is the whole
    # buffer and `at` is 0, and the rest fits whatever the arithmetic.
    'curl-tool/src/stdio\.rs:.*: replace - with \+ in Stdio<S>::put$',
    # The extra turn writes nothing: an empty write returns `Ok(0)`, which
    # ends the loop with the same count.
    'curl-tool/src/output\.rs:.*: replace < with <= in unbuffered$',
    # `left_ms` never gives 0: none left reads as -1, as C's
    # `Curl_cshutdn_timeleft_ms` gives it.
    'curl-core/src/conn/shutdown\.rs:.*: replace < with <= in Shutting::try_once$',
    # A time left equal to the least so far sets the same least.
    'curl-core/src/conn/shutdown\.rs:.*: replace < with <= in ShutdownSet::perform$',
    # Only the debug build's invariant check asks it, of a socket entry
    # naming a closing connection: true passes only a state the check
    # exists to refuse, which no correct run reaches.
    'curl-core/src/conn/shutdown\.rs:.*: replace ShutdownSet::holds -> bool with true$',
    # With none shutting down to that destination, closing the oldest of
    # them closes none and takes nothing off.
    'curl-core/src/conn/pool\.rs:.*: replace > with >= in shutdowns_over$',
    # Debug forms nothing reads.
    'curl-core/src/tls\.rs:.*: replace <impl fmt::Debug for dyn TlsBackend>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    'curl-core/src/conn/tls\.rs:.*: replace <impl fmt::Debug for TlsLayer>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    'curl-core/src/tls/fake\.rs:.*: replace <impl fmt::Debug for FakeSession>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    # A library traces its records only for a debug handler: without one,
    # SSL data is written nowhere (`Curl_debug`), so asking is a saving.
    'curl-core/src/tls\.rs:.*: replace TlsIo<.*>::debugs -> bool with true$',
    # The fake's log keeps the room of the first 32 receives; no test
    # reads more than that many through it.
    'curl-core/src/tls/fake\.rs:.*: replace < with <= in <impl TlsSession for FakeSession>::recv$',
    # The fake gives out what it holds before it reads again, so it says
    # a read would block only holding nothing: whenever the core asks
    # whether it holds bytes (after such a read), the answer is no, and a
    # wrong yes costs only a pass that reads "would block" again.
    'curl-core/src/tls/fake\.rs:.*: (replace <impl TlsSession for FakeSession>::pending -> bool with (true|false)|delete ! in <impl TlsSession for FakeSession>::pending)$',
    # The fake's reading of what a client sent is given whole records by
    # every test; a cut one matters to no core test.
    'curl-core/src/tls/fake\.rs:.*: replace match guard rest\.len\(\) >= HEADER \+ len with true in read_client$',
    # Debug forms nothing reads.
    'curl-core/src/gss\.rs:.*: replace <impl fmt::Debug for dyn (Gss|GssContext)>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    # Releasing what MIT krb5 allocated: only a leak checker sees it kept,
    # and none the tests run under sees the library's heap (Miri cannot
    # run FFI). Releasing an empty buffer or a context never made is the
    # library's no-op.
    'curl-gssapi/src/sys\.rs:.*: (replace <impl Drop for (Buffer|Name|Cred|OidSet|Ctx)>::drop with \(\)|delete ! in <impl Drop for (Buffer|Ctx)>::drop)$',
    # MIT krb5 sets a call's output handle exactly when the call succeeds,
    # NULL from the start otherwise: the status and the handle agree on
    # every answer, so either test alone decides the same.
    'curl-gssapi/src/sys\.rs:.*: replace \|\| with && in (Name::import|Cred::acquire|OidSet::mechanisms|OidSet::without|Ctx::initiator)$',
    # Credentials acquired for every mechanism hold SPNEGO's, whose
    # `gss_set_neg_mechs` only copies the set: it fails only for want of
    # memory, which no test can make the library run short of.
    'curl-gssapi/src/sys\.rs:.*: replace Cred::set_neg_mechs -> Result<\(\), Status> with Ok\(\(\)\)$',
    # SPNEGO's stub credentials always leave NTLM out (the stub's
    # mechanism list and its narrowing cannot fail while it is chosen),
    # so a stub context SPNEGO checks is never NTLM's, as in C's stub;
    # Kerberos contexts are not checked.
    'curl-gssapi/src/stub\.rs:.*: replace Ctx::is_ntlm -> bool with false$',
    # The system's resolver answers as it starts, and the tests' `AtOnce`
    # too: nothing ever asks either for an answer later, waits for one or
    # cancels one, which `unreachable!` says.
    'curl-core/src/conn/io\.rs:.*: replace <impl Resolver for (SystemResolver|AtOnce<F>)>::(answer|wait|cancel) .*$',
    # No test fails a resolve through `AtOnce`, so what it says of a
    # failure is never read.
    'curl-core/src/conn/io\.rs:.*: replace <impl Resolver for AtOnce<F>>::explain .*$',
    # The fake network's: a transfer told of an answer still held finds
    # none when it asks, and waits on as before.
    'curl-core/src/conn/io\.rs:.*: replace && with \|\| in <impl Resolver for FakeNet>::answered$',
    # std's thread start fails only when the system refuses a thread,
    # which no test can arrange.
    'curl-core/src/conn/threaded\.rs:.*: replace -= with (\+=|/=) in ThreadedResolver::start_threads$',
    # Joining a thread that has ended frees its handle: the thread has
    # ended either way, and the handles left are joined as the resolver
    # goes.
    'curl-core/src/conn/threaded\.rs:.*: (replace ThreadedResolver::reap with \(\)|replace < with > in ThreadedResolver::reap)$',
    # Reads the process's environment, which a test cannot set for itself
    # alone; `DebugVars::from_given` holds the reading, and is tested.
    'curl-core/src/conn/threaded\.rs:.*: replace DebugVars::from_env -> DebugVars with Default::default\(\)$',
    # Only a socket watched after its REMOVE, which the panic beside it
    # reports as the bug it is, meets the guard false.
    'curl-core/src/multi/wait\.rs:.*: replace match guard wake_key == Some\(key\) with true in Multi<H>::poll_watched$',
    # Decides only whether the tool's exit joins the resolver's threads; a
    # thread left running ends with the process, and nothing can see it
    # outlived the exit.
    'curl-tool/src/operate\.rs:.*: replace quick_exit -> bool with (true|false)$',
    # Without the threaded resolver, a multi's system network is the
    # default one; with it, the test of the network catches the change.
    'curl-core/src/conn/io\.rs:.*: replace SystemNet::for_multi -> io::Result<SystemNet> with Ok\(Default::default\(\)\)$',
    # A quick exit decides only whether the multi's cleanup joins the
    # resolver's threads, which nothing can see.
    'curl-sys-abi/src/multi\.rs:.*: replace != with == in resolving$',
    # The suites read curlinfo's lines; `toggles` is what they say, and is
    # tested. Without the threaded resolver its own arm says what the
    # table does.
    'curl-tool/src/bin/curlinfo\.rs:.*: (replace main with \(\)|delete match arm "resolv-threaded" in toggles)$',
    # libidn2's strings freed, its reservations sized, its answers on
    # success never NULL, an allocation of its failing, and its flags'
    # disjoint bits: none observable but by a leak checker, an
    # allocation failure no test can make it have, or the same bits.
    'curl-idn2/src/lib\.rs:.*: (replace <impl Drop for Made>::drop with \(\)|replace \+ with (-|\*) in terminated|delete match arm MALLOC in answer|replace match guard !made\.0\.is_null\(\) with true in answer|replace \| with \^ in <impl Idn for Idn2>::to_ascii|delete -)$',
    # The memdump written as the process exits is read by curl-tool's
    # memdebug test, a process of its own, which curl-alloc's in-process
    # tests cannot be; a flush at exactly a full buffer is one too many,
    # writing the same lines.
    'curl-alloc/src/track\.rs:.*: (replace flush_at_exit with \(\)|replace < with <= in write_log)$',
    # A line's room made larger than any line needs changes nothing.
    'curl-core/src/altsvc\.rs:.*: replace \+ with \* in AltSvc::text$',
    # The room for an HSTS name's terminating NUL: taken away, only a C
    # function reading past the name sees it, which no Rust test can
    # without reading out of bounds; runtests 1915 and 1916 under valgrind
    # do.
    'curl-sys-abi/src/callbacks\.rs:.*: replace \+ with \* in <impl curl_core::hsts::Hsts(Reader|Writer) for Adapter>::(read|write)$',
    # A write function's CURLSTS_FAIL and CURLSTS_DONE both stop the
    # save; that one fails it goes unsaid as the handle goes, as in C.
    'curl-sys-abi/src/callbacks\.rs:.*: delete match arm ffi::CURLSTS_FAIL in <impl curl_core::hsts::HstsWriter for Adapter>::write$',
    # The escape branch's own limit check: the check after it fires
    # whenever it would, so moving it changes no word read (C's has both).
    'curl-core/src/altsvc\.rs:.*: replace > with (==|>=) in Cursor<.a>::quoted$',
    # A raw receive's failing errno, which the fake network cannot fail
    # and a real reset needs SO_LINGER for.
    'curl-core/src/multi/raw\.rs:.*: replace <impl LayerCx for RawCx<._>>::socket_failed with \(\)$',
    # A connection settles in the step that finds what it speaks, and its
    # transfer steps again in that same pass: a wake one step late still
    # lets its waiters go in the pass, before any of them runs, as
    # `a_pipewait_ends_in_the_pass_its_connection_settles` checks.
    # (The second comparison, the stored verdict's; the column tells it.)
    'curl-core/src/conn/pool\.rs:\d+:67: replace == with != in Pool::settle$',
    # An assertion no correct pool reaches: the multi gives back every
    # share's connection lent to it before its pool goes.
    'curl-core/src/conn/pool\.rs:.*: replace <impl Drop for Pool>::drop with \(\)$',
    # A connection found to speak HTTP/2 is attached or lent before it
    # settles; one settles only when lending it ran out of memory, and
    # then serves its transfer alone either way.
    'curl-core/src/conn/pool\.rs:.*: replace match guard settled && !conn\.is_h2\(\) with true in Verdict::of$',
    # The internal trace's Debug names no field.
    'curl-core/src/trace\.rs:.*: replace <impl fmt::Debug for Internal>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    # `left_ms` says -1 for no time left, never 0.
    'curl-core/src/conn/shutdown\.rs:.*: replace < with <= in Shutting::run_once$',
]
