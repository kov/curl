[package]
name = "curl-idn2"
description = "Internationalized host names for the curl rewrite, from libidn2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "idn2"

[features]
# ICU's IDNA from the system on Apple's, in place of libidn2
# (`USE_APPLE_IDN`).
apple-idn = []
# Windows' IdnToAscii and IdnToUnicode, in place of libidn2
# (`USE_WIN32_IDN`).
win-idn = []

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }
# Whether names are UTF-8 (Windows' Unicode build) or the locale's.
curl-os = { path = "../curl-os" }

# Windows' IDN and code-page conversions.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }

[dev-dependencies]
# The tests set the locale libidn2 reads names in.
libc = "0.2"

[build-dependencies]
curl-build = { path = "../curl-build" }

[lints]
workspace = true
