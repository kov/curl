[package]
name = "curl-wolfssl"
description = "wolfSSL for the curl rewrite: TLS as lib/vtls/wolfssl.c drives it, and Ed25519 signatures for HTTP message signing with wolfCrypt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "wolfssl"

[features]
# The debug build's memory tracker, which the library's own BIO method,
# made at the global init, is kept out of.
debug-hooks = ["curl-alloc/debug-hooks"]

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }

[build-dependencies]
curl-build = { path = "../curl-build" }
cc = "1.10.0"

[dev-dependencies]
# The multi's clock, given as the tests give it.
curl-core = { path = "../curl-core", features = ["test-util"] }

[lints]
workspace = true
