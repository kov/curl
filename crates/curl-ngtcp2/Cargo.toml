[package]
name = "curl-ngtcp2"
description = "HTTP/3 over QUIC for the curl rewrite, from ngtcp2 and nghttp3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "ngtcp2"

[features]
# The TLS library ngtcp2's crypto is for, the build's: exactly one.
default = ["openssl"]
openssl = ["dep:openssl-sys"]
gnutls = ["dep:curl-gnutls"]
wolfssl = ["dep:curl-wolfssl"]

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }
curl-os = { path = "../curl-os" }
libc = "0.2"
# The OpenSSL-family library found, which says whether it is LibreSSL
# (`DEP_OPENSSL_LIBRESSL_VERSION_NUMBER`), for the crypto linked; the
# library itself, as `curl-openssl` links it.
openssl-sys = { version = "0.9.118", optional = true }
# GnuTLS and wolfSSL, as their crates link them, after the crypto that
# needs them; and their sessions for the tests.
curl-gnutls = { path = "../curl-gnutls", optional = true }
curl-wolfssl = { path = "../curl-wolfssl", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
curl-core = { path = "../curl-core", features = ["test-util"] }
# The TLS session a connection is handed in the OpenSSL build (the
# others' are their features' dependencies), and its library linked.
curl-openssl = { path = "../curl-openssl" }
# The certificates the server the tests start shows.
openssl = "0.10.82"

[build-dependencies]
curl-build = { path = "../curl-build" }

[lints]
workspace = true
