# Infallible allocation aborts the process on failure, and a library must
# not (DESIGN.md, "Allocation failure"). Use curl-alloc's replacements.
# `Clone::clone` cannot be banned for allocating types alone; the torture
# tests catch an infallible clone.
disallowed-methods = [
    { path = "std::boxed::Box::new", reason = "use curl_alloc::try_box" },
    { path = "std::sync::Arc::new", reason = "allocates infallibly" },
    { path = "std::rc::Rc::new", reason = "allocates infallibly" },
    { path = "std::vec::Vec::with_capacity", reason = "use Vec::new and try_reserve" },
    { path = "std::vec::Vec::push", reason = "use curl_alloc::TryVec::try_push" },
    { path = "std::vec::Vec::insert", reason = "reserve with try_reserve first" },
    { path = "std::vec::Vec::extend_from_slice", reason = "use curl_alloc::TryVec::try_extend_from_slice" },
    { path = "std::vec::Vec::extend_from_within", reason = "reserve with try_reserve first" },
    { path = "std::vec::Vec::append", reason = "reserve with try_reserve first" },
    { path = "std::vec::Vec::resize", reason = "reserve with try_reserve first" },
    { path = "std::vec::Vec::reserve", reason = "use try_reserve" },
    { path = "std::vec::Vec::reserve_exact", reason = "use try_reserve_exact" },
    { path = "std::vec::Vec::into_boxed_slice", reason = "may reallocate to shrink" },
    { path = "std::vec::Vec::shrink_to_fit", reason = "reallocates infallibly" },
    { path = "std::string::String::with_capacity", reason = "use String::new and try_reserve" },
    { path = "std::string::String::push", reason = "use curl_alloc::TryString::try_push" },
    { path = "std::string::String::push_str", reason = "use curl_alloc::TryString::try_push_str" },
    { path = "std::string::String::insert", reason = "reserve with try_reserve first" },
    { path = "std::string::String::insert_str", reason = "reserve with try_reserve first" },
    { path = "std::string::String::reserve", reason = "use try_reserve" },
    { path = "std::string::String::reserve_exact", reason = "use try_reserve_exact" },
    { path = "std::string::ToString::to_string", reason = "use curl_alloc::try_format" },
    { path = "std::borrow::ToOwned::to_owned", reason = "allocates infallibly" },
    { path = "slice::to_vec", reason = "allocates infallibly" },
    { path = "str::to_uppercase", reason = "allocates infallibly" },
    { path = "str::to_lowercase", reason = "allocates infallibly" },
    { path = "str::repeat", reason = "allocates infallibly" },
    { path = "std::iter::Iterator::collect", reason = "allocates infallibly" },
    { path = "std::iter::Extend::extend", reason = "allocates infallibly" },
    { path = "std::collections::HashMap::insert", reason = "reserve with try_reserve first" },
    { path = "std::collections::VecDeque::push_back", reason = "reserve with try_reserve first" },
    { path = "std::collections::VecDeque::push_front", reason = "reserve with try_reserve first" },
    # The argument strings are wiped in place (curl_os::args); nothing else
    # may read them, or a read could race the wipe.
    { path = "std::env::args", reason = "use curl_os::args::command_line" },
    { path = "std::env::args_os", reason = "use curl_os::args::command_line" },
    # They copy a value found with an allocation that cannot fail.
    { path = "std::env::var", reason = "use curl_os::env" },
    { path = "std::env::var_os", reason = "use curl_os::env" },
    # They copy a path of 384 bytes or more with an allocation that cannot
    # fail. Use curl_os::fs, which takes a C string.
    { path = "std::fs::File::open", reason = "use curl_os::fs::open_read" },
    { path = "std::fs::File::create", reason = "use curl_os::fs::open_write" },
    { path = "std::fs::File::create_new", reason = "use curl_os::fs::open_write" },
    { path = "std::fs::OpenOptions::open", reason = "use curl_os::fs::open_write" },
    { path = "std::fs::metadata", reason = "use curl_os::fs::stat" },
    { path = "std::fs::symlink_metadata", reason = "copies the path infallibly" },
    { path = "std::fs::remove_file", reason = "use curl_os::fs::remove" },
    { path = "std::fs::rename", reason = "use curl_os::fs::rename" },
    { path = "std::fs::DirBuilder::create", reason = "use curl_os::fs::make_dir" },
    { path = "std::fs::create_dir", reason = "use curl_os::fs::make_dir" },
    { path = "std::fs::create_dir_all", reason = "copies the path infallibly" },
    { path = "std::fs::remove_dir", reason = "copies the path infallibly" },
    { path = "std::fs::remove_dir_all", reason = "copies the path infallibly" },
    { path = "std::fs::read", reason = "copies the path infallibly" },
    { path = "std::fs::read_to_string", reason = "copies the path infallibly" },
    { path = "std::fs::read_dir", reason = "use curl_os::fs::Dir" },
    { path = "std::fs::read_link", reason = "copies the path infallibly" },
    { path = "std::fs::write", reason = "copies the path infallibly" },
    { path = "std::fs::copy", reason = "copies the path infallibly" },
    { path = "std::fs::hard_link", reason = "copies the path infallibly" },
    { path = "std::fs::canonicalize", reason = "copies the path infallibly" },
    { path = "std::fs::set_permissions", reason = "copies the path infallibly" },
    { path = "std::fs::exists", reason = "copies the path infallibly" },
    { path = "std::path::Path::exists", reason = "copies the path infallibly" },
    { path = "std::path::Path::is_file", reason = "copies the path infallibly" },
    { path = "std::path::Path::is_dir", reason = "copies the path infallibly" },
    { path = "std::path::Path::metadata", reason = "copies the path infallibly" },
    { path = "std::path::Path::canonicalize", reason = "copies the path infallibly" },
    { path = "std::path::Path::read_dir", reason = "copies the path infallibly" },
    { path = "std::os::unix::fs::symlink", reason = "copies the path infallibly" },
]
disallowed-macros = [
    { path = "std::format", reason = "use curl_alloc::try_format" },
    { path = "std::vec", reason = "allocates infallibly" },
]
