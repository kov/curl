[package]
name = "curl-openssl"
description = "OpenSSL for the curl rewrite: TLS, and Ed25519 signatures for HTTP message signing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A peer OpenSSL cannot verify is verified by Apple's SecTrust, against the
# system's trust settings, which are the default trust store (C's
# `USE_APPLE_SECTRUST`); macOS only.
apple-sectrust = ["curl-core/apple-sectrust"]
# The system's own store of certificates is the default trust store where
# a transfer names none (C's `CURL_CA_NATIVE`): Windows' read in, and no
# CA bundle or directory looked for at build.
native-ca = ["curl-core/native-ca"]

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-core = { path = "../curl-core" }
curl-os = { path = "../curl-os" }
# Declarations only: the system's library, never the `vendored` copy.
openssl-sys = "0.9.118"

[target.'cfg(windows)'.dependencies]
# The system's certificate stores, read for the native CA store.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }

[build-dependencies]
# The CA bundle and path, found as CMake finds them.
curl-build = { path = "../curl-build" }

[dev-dependencies]
curl-alloc = { path = "../curl-alloc", features = ["debug-hooks"] }
# The manual clock, to age the multi's CA store, and the peer's bounded accept.
curl-core = { path = "../curl-core", features = ["test-util"] }
# The peer's side of the tests' TLS, and the certificates it shows.
openssl = "0.10.82"

[[test]]
name = "peer"
# The allocation tracker is the global allocator.
harness = false

[lints]
workspace = true
