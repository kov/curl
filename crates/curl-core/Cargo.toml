[package]
name = "curl-core"
description = "The Rust API of the curl rewrite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The build has a QUIC library (ngtcp2, over OpenSSL or GnuTLS): HTTP3
# claimed. Off unless the build turns it on, as the shim's and the tool's
# `openssl` and `gnutls` features do; Schannel's build has none.
quic = []
# The build tunnels through HTTP/3 proxies (C's `USE_PROXY_HTTP3`, which
# CMake builds over OpenSSL only): proxy-HTTP3 claimed, and
# `CURLPROXY_HTTPS3` taken. On with the `openssl` feature alone.
proxy-http3 = ["quic"]
# The build signs HTTP messages (an Ed25519 library, OpenSSL's): HTTPSIG
# claimed. On as `quic` is.
httpsig = []
# The counterpart of the C debug build: reports the `Debug` feature, and
# will carry the debug-only behaviours the test suite relies on.
debug-hooks = []
# Test doubles for other crates' tests: the manual clock; and the
# memory tracker, which the fakes keep their own memory out of.
test-util = ["curl-alloc/debug-hooks"]
# The threaded resolver as the system's (C's `--enable-threaded-resolver`):
# a pool of threads per multi, in place of the resolver that answers at
# once.
threaded-resolver = []
# The TLS library verifies a peer it cannot with Apple's SecTrust, as C's
# `USE_APPLE_SECTRUST`: claims the `AppleSecTrust` feature.
apple-sectrust = []
# The system's own store of certificates is the default trust store where
# a transfer names none (C's `CURL_CA_NATIVE`): claims the `NativeCA`
# feature.
native-ca = []
# Windows' Unicode build (C's `ENABLE_UNICODE`), which `curl-os` makes:
# claims the `Unicode` feature.
unicode = ["curl-os/unicode"]

[dependencies]
curl-alloc = { path = "../curl-alloc" }
curl-tls-native = { path = "../curl-tls-native" }
curl-os = { path = "../curl-os", features = ["net", "fs"] }
# `#[mutants::skip]`, for cargo-mutants: an attribute and nothing else.
mutants = "0.0.4"

[dev-dependencies]
curl-alloc = { path = "../curl-alloc", features = ["debug-hooks"] }
# The integration tests need the test doubles without asking for them.
curl-core = { path = ".", features = ["test-util"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[build-dependencies]
# Whether the build has an LDAP library, as the LDAP crate decides it.
curl-build = { path = "../curl-build" }

[[test]]
name = "torture"
# The tracker's limit is process-wide and fails the harness's own
# allocations too.
harness = false

[lints]
workspace = true
